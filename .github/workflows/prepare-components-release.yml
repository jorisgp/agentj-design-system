name: Prepare Components Release

on:
  push:
    branches:
      - release/components/**
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch to prepare
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-components-release-${{ github.event_name == 'push' && github.ref_name || github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.release_branch }}
  cancel-in-progress: false

jobs:
  prepare-components-release:
    if: >
      (
        github.event_name == 'push' &&
        startsWith(github.ref_name, 'release/components/')
      ) ||
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'release/components/')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.release_branch, 'release/components/')
      )
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.release_branch }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify clean release checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Release preparation requires a clean checkout."
            git status --short
            exit 1
          fi

      - name: Preview release
        run: pnpm nx release version patch --groups components --dry-run

      - name: Version package
        run: pnpm nx release version patch --groups components --stage-changes=false

      - name: Read release version
        id: release
        run: |
          VERSION="$(node -e "console.log(require('./libs/agent-j-components/package.json').version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=agent-j-components@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: pnpm nx release changelog "${{ steps.release.outputs.version }}" --groups components --stage-changes=false

      - name: Commit release preparation
        run: |
          # The checkout was verified clean before generation. Include all Nx
          # outputs, including consumed version plans and dependency updates.
          git add --all
          git commit -m "release(agent-j-components): ${{ steps.release.outputs.version }}"
          git fetch origin "${RELEASE_BRANCH}"
          git rebase "origin/${RELEASE_BRANCH}"
          git push origin HEAD:${RELEASE_BRANCH}

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="$(gh pr list \
            --base main \
            --head "${RELEASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --title "Release agent-j-components ${{ steps.release.outputs.version }}" \
              --body "Release agent-j-components ${{ steps.release.outputs.version }}"
          else
            gh pr create \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --title "Release agent-j-components ${{ steps.release.outputs.version }}" \
              --body "Release agent-j-components ${{ steps.release.outputs.version }}"
          fi
