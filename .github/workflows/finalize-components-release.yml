name: Finalize Components Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  finalize-components-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/components/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release metadata
        id: release
        run: |
          VERSION="$(node -e "console.log(require('./libs/agent-j-components/package.json').version)")"
          NAME="$(node -e "console.log(require('./libs/agent-j-components/package.json').name)")"
          SCOPE="$(node -e "console.log(require('./libs/agent-j-components/package.json').name.split('/')[0])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "tag=agent-j-components@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          pnpm nx test agent-j-components --skip-nx-cache
          pnpm nx build agent-j-components --configuration=production --skip-nx-cache

      - name: Set repository metadata for provenance
        run: |
          npm pkg set repository.type="git" --prefix dist/libs/agent-j-components
          npm pkg set repository.url="git+https://github.com/jorisgp/agent-j-utils.git" --prefix dist/libs/agent-j-components
          npm pkg set bugs.url="https://github.com/jorisgp/agent-j-utils/issues" --prefix dist/libs/agent-j-components
          npm pkg set homepage="https://github.com/jorisgp/agent-j-utils" --prefix dist/libs/agent-j-components

      - name: Verify npm authentication
        run: |
          npm whoami
          npm access ls-packages "${{ steps.release.outputs.scope }}" >/dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if version exists on npm
        id: npm_check
        run: |
          if npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish dist/libs/agent-j-components --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        run: |
          if git rev-parse "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.release.outputs.tag }} already exists locally"
          elif git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.release.outputs.tag }} already exists on origin"
          else
            git tag "${{ steps.release.outputs.tag }}"
            git push origin "${{ steps.release.outputs.tag }}"
          fi

      - name: Open main to develop sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head main \
            --title "Sync main into develop after ${{ steps.release.outputs.tag }}" \
            --body "Sync release ${{ steps.release.outputs.tag }} back into develop."
